<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="grid-stage">
    <div class="grid-container">
      <div class="grid-row grid-row--header">
        <div class="grid-cell grid-cell--purple"></div>
      </div>
      <div class="grid-row grid-row--content">
        <div class="grid-cell grid-cell--panel grid-cell--quarter grid-cell--padded">
          <div class="blue-block"></div>
          <div class="blue-block"></div>
          <div class="blue-block"></div>
          <div class="blue-block"></div>
        </div>
        <div class="grid-cell grid-cell--panel"></div>
        <div class="grid-cell grid-cell--panel"></div>
        <div class="grid-cell grid-cell--panel"></div>
        <div class="grid-cell grid-cell--panel"></div>
        <div class="grid-cell grid-cell--panel"></div>
        <div class="grid-cell grid-cell--panel"></div>
        <div class="grid-cell grid-cell--panel grid-cell--quarter grid-cell--padded">
          <div class="blue-block blue-block--tall"></div>
        </div>
      </div>
      <div class="grid-row grid-row--footer">
        <div class="grid-cell grid-cell--teal"></div>
      </div>
    </div>
  </div>

  <div class="grid-container grid-guides">
    <div class="grid-row">
      <div class="grid-cell grid-cell--guide-start"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
      <div class="grid-cell grid-cell--guide"></div>
    </div>
  </div>

  <p class="resize-instruction">Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>
</body>
</html>
